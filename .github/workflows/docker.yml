name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jijin

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_BASE_PATH=/jiJin
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 默认不跑；Variables 设 ENABLE_ECS_DEPLOY=true 并配置 DEPLOY_* Secrets 后才会部署
  # 部署方式：SSH 到 ECS → git pull → 本机 docker compose build（不拉 ghcr）
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_ECS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: SSH build & deploy on ECS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # ECS 上 build（含拉基础镜像）可能较慢
          command_timeout: 45m
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            REPO_URL="https://github.com/Ben-artist/ji.git"
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if [ ! -d .git ]; then
              echo "==> not a git repo, initializing from GitHub"
              git init
              git remote add origin "$REPO_URL"
              git fetch origin main
              # -f 覆盖已有代码文件；未跟踪的 .env 会保留
              git checkout -f -B main origin/main
            fi

            echo "==> git pull"
            git remote set-url origin "$REPO_URL"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "ERROR: missing $DEPLOY_PATH/.env (VITE_* and runtime secrets)"
              exit 1
            fi

            echo "==> docker compose build & up"
            docker compose up -d --build
            echo "==> prune"
            docker image prune -f
            echo "==> done"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
