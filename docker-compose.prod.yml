# 服务器用：在 ECS 上本地 build（不拉 ghcr）
# 用法：docker compose -f docker-compose.prod.yml up -d --build
# 推荐直接用 docker-compose.yml，效果相同
services:
  jijin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: jijin:latest
    container_name: jijin
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
